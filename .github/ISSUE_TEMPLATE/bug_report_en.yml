name: Bug report (English)
description: Report a reproducible userscript problem in English.
title: "[Bug]: "
labels:
  - bug
  - "status: needs-triage"
body:
  - type: dropdown
    id: script
    attributes:
      label: Affected script
      options:
        - Makaytron Etsy Sale Manager
        - Makaytron Etsy Message Assistant
        - Makaytron Etsy Ads Keyword Manager
        - Makaytron Etsy Listing Analyzer
        - Makaytron Etsy Keyword & Market Analyzer
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Script version
      placeholder: 1.0.2
    validations:
      required: true
  - type: dropdown
    id: installation_source
    attributes:
      label: Installation source
      description: Identify the exact GitHub Release asset or canonical raw main source; these sources may carry different versions while a release candidate is being prepared.
      options:
        - Canonical raw main link
        - GitHub Release asset
        - Another distribution platform
        - Local or development copy
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 140
    validations:
      required: true
  - type: input
    id: tampermonkey
    attributes:
      label: Tampermonkey version
      placeholder: 5.x
    validations:
      required: true
  - type: input
    id: etsy_path
    attributes:
      label: Etsy page or flow
      description: Do not include a shop, customer, or order identifier.
      placeholder: Shop Manager > Marketing > Etsy Ads > Listing keywords
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: live_write
    attributes:
      label: Live Etsy write status
      description: Was a message sent, a campaign created, an advertising keyword changed, or a listing edited/deactivated while reproducing this problem? Enter "No" if not; otherwise describe the action and its impact. Do not repeat a live action just to report the bug.
      placeholder: No — I used synthetic or read-only validation.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Attach only screenshots or console output with API keys, cookies, access tokens, nonce/full request IDs, customer/order details, shop/listing identifiers, keyword/listing content, and metrics removed. Do not share authenticated Etsy HTML.
      placeholder: Attach a redacted screenshot or paste sanitized error output.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not share API keys, cookies, access tokens, nonce/full request IDs, customer messages, shop/listing or order identifiers, or real Etsy metrics, and I redacted all attached evidence.
          required: true
