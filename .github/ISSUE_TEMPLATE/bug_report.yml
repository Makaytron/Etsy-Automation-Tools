name: Hata bildirimi
description: Tekrarlanabilir bir userscript hatası bildirin.
title: "[Bug]: "
labels:
  - bug
  - "status: needs-triage"
body:
  - type: dropdown
    id: script
    attributes:
      label: Etkilenen script
      options:
        - Makaytron Etsy Sale Manager
        - Makaytron Etsy Message Assistant
        - Makaytron Etsy Ads Keyword Manager
        - Makaytron Etsy Listing Analyzer
        - Makaytron Etsy Keyword & Market Analyzer
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Script sürümü
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: installation_source
    attributes:
      label: Kurulum kaynağı
      description: Kesin GitHub Release varlığını veya canonical raw main kaynağını belirtin; bir release adayı hazırlanırken bu kaynaklar farklı sürümler taşıyabilir.
      options:
        - Canonical raw main bağlantısı
        - GitHub Release varlığı
        - Başka dağıtım platformu
        - Yerel veya geliştirme kopyası
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Tarayıcı ve sürümü
      placeholder: Chrome 140
    validations:
      required: true
  - type: input
    id: tampermonkey
    attributes:
      label: Tampermonkey sürümü
      placeholder: 5.x
    validations:
      required: true
  - type: input
    id: etsy_path
    attributes:
      label: Etsy sayfası veya akışı
      description: Mağaza, müşteri veya sipariş kimliği eklemeyin.
      placeholder: Shop Manager > Marketing > Etsy Ads > Listing keywords
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Tekrar üretme adımları
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Beklenen davranış
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Gerçekleşen davranış
    validations:
      required: true
  - type: textarea
    id: live_write
    attributes:
      label: Canlı Etsy yazma durumu
      description: Bu hatayı yeniden üretirken mesaj gönderildi, kampanya oluşturuldu, reklam anahtar kelimesi değiştirildi veya listing düzenlendi/deaktif edildi mi? Hayırsa "Hayır" yazın; yapıldıysa işlemi ve etkisini açıklayın. Hatayı bildirmek için canlı işlemi tekrarlamayın.
      placeholder: Hayır — sentetik veya salt-okunur doğrulama kullandım.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redakte edilmiş kanıt
      description: Yalnızca API anahtarı, çerez, erişim belirteci, nonce/tam request ID, müşteri/sipariş bilgisi, mağaza/listing kimliği, keyword/listing içeriği ve metrikleri kapatılmış ekran görüntüsü veya konsol çıktısı ekleyin. Kimliği doğrulanmış Etsy HTML'ini paylaşmayın.
      placeholder: Redakte edilmiş ekran görüntüsünü sürükleyin veya hassas bilgiler ayıklanmış hata metnini ekleyin.
  - type: checkboxes
    id: privacy
    attributes:
      label: Gizlilik kontrolü
      options:
        - label: API anahtarı, çerez, erişim belirteci, nonce/tam request ID, müşteri mesajı, mağaza/listing veya sipariş kimliği ya da gerçek Etsy metriği paylaşmadım; eklediğim kanıtları redakte ettim.
          required: true
