name: Message Assistant Privacy Hotfix Verification

on:
  push:
    branches:
      - fix/privacy-blocked-literal
    paths:
      - '.github/workflows/privacy-blocked-literal-diagnostic.yml'
      - 'scripts/etsy-ads-keyword-manager/README.md'
      - 'scripts/etsy-ads-keyword-manager/README.en.md'
      - 'scripts/etsy-ads-keyword-manager/CHANGELOG.md'

permissions:
  contents: write

jobs:
  verify-hotfix:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/privacy-blocked-literal
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply exact privacy hotfix
        shell: pwsh
        run: |
          $scriptPath = 'scripts/etsy-message-assistant/Makaytron-Etsy-Message-Assistant.user.js'
          $changelogPath = 'scripts/etsy-message-assistant/CHANGELOG.md'
          $script = Get-Content -Raw -LiteralPath $scriptPath

          # Reconstruct the legacy account-specific placeholder only in runner memory so
          # neither this workflow nor any tracked diagnostic file republishes the value.
          $legacyStoreId = -join ([char[]](112,97,107,97,121,117,115))
          $legacyPlaceholder = 'placeholder="' + $legacyStoreId + '"'
          $syntheticPlaceholder = 'placeholder="example-shop"'

          $anchors = @(
            '// @version      1.2.7',
            "const APP_VERSION = '1.2.7';",
            $legacyPlaceholder
          )
          foreach ($anchor in $anchors) {
            $count = ([regex]::Matches($script, [regex]::Escape($anchor))).Count
            if ($count -ne 1) { throw "Expected exactly one hotfix anchor (found $count)." }
          }

          $script = $script.Replace('// @version      1.2.7', '// @version      1.2.8')
          $script = $script.Replace("const APP_VERSION = '1.2.7';", "const APP_VERSION = '1.2.8';")
          $script = $script.Replace($legacyPlaceholder, $syntheticPlaceholder)
          Set-Content -LiteralPath $scriptPath -Value $script -NoNewline -Encoding utf8

          $changelog = Get-Content -Raw -LiteralPath $changelogPath
          if ($changelog -match '(?m)^## \[1\.2\.8\]') { throw 'CHANGELOG already contains 1.2.8.' }
          $entry = @"
          ## [Unreleased]

          ## [1.2.8] - 2026-09-02

          ### Security

          - Merkezi Mesaj Paneli ayarlarındaki mağaza kimliği placeholder'ı artık gerçek bir mağaza adını örnek olarak göstermiyor; public dağıtım yalnız sentetik `example-shop` örneğini kullanıyor.
          - Userscript sürümü `1.2.8` yapılarak gizlilik düzeltmesinin mevcut kurulumlara normal update akışıyla ulaşması sağlandı.
          "@
          $updated = [regex]::Replace($changelog, '(?m)^## \[Unreleased\]\r?\n', ($entry.TrimEnd() + "`r`n`r`n"), 1)
          if ($updated -eq $changelog) { throw 'Unable to insert 1.2.8 changelog entry.' }
          Set-Content -LiteralPath $changelogPath -Value $updated -NoNewline -Encoding utf8

      - name: Check JavaScript syntax
        run: node --check scripts/etsy-message-assistant/Makaytron-Etsy-Message-Assistant.user.js

      - name: Run Message Assistant behavior tests
        run: node --test tools/Test-Message-Assistant.mjs

      - name: Smoke-test browser fixture
        run: node --test tools/Test-Message-Assistant-Browser-Fixture.mjs

      - name: Enforce public fixture privacy
        shell: pwsh
        run: ./tools/Sanitize-Public-Fixtures.ps1

      - name: Run complete distribution gate
        shell: pwsh
        run: ./tools/Test-Distribution.ps1

      - name: Patch hygiene
        run: git diff --check

      - name: Confirm hotfix scope
        shell: pwsh
        run: |
          $changed = @(git diff --name-only)
          $expected = @(
            'scripts/etsy-message-assistant/CHANGELOG.md',
            'scripts/etsy-message-assistant/Makaytron-Etsy-Message-Assistant.user.js'
          )
          $actual = @($changed | Sort-Object)
          $want = @($expected | Sort-Object)
          if (($actual -join "`n") -ne ($want -join "`n")) {
            throw "Unexpected hotfix scope: $($actual -join ', ')"
          }

      - name: Commit verified hotfix to branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/etsy-message-assistant/CHANGELOG.md scripts/etsy-message-assistant/Makaytron-Etsy-Message-Assistant.user.js
          git commit -m "security: neutralize Message Assistant store placeholder"
          git push origin HEAD:fix/privacy-blocked-literal
