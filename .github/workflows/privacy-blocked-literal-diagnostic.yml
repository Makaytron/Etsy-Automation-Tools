name: Message Assistant Privacy Hotfix Final Verification

on:
  push:
    branches:
      - fix/privacy-blocked-literal
    paths:
      - '.github/workflows/privacy-blocked-literal-diagnostic.yml'

permissions:
  contents: write

jobs:
  final-verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out verified hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/privacy-blocked-literal
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize changelog control character
        shell: pwsh
        run: |
          $path = 'scripts/etsy-message-assistant/CHANGELOG.md'
          $text = Get-Content -Raw -LiteralPath $path
          $bad = ([char]27) + 'xample-shop'
          $good = [char]96 + 'example-shop' + [char]96
          $count = ([regex]::Matches($text, [regex]::Escape($bad))).Count
          if ($count -ne 1) { throw "Expected exactly one malformed changelog token; found $count." }
          $text = $text.Replace($bad, $good)
          Set-Content -LiteralPath $path -Value $text -NoNewline -Encoding utf8

      - name: Reject control characters in changed public text
        shell: pwsh
        run: |
          $paths = @(
            'README.md',
            'README.tr.md',
            'scripts/etsy-ads-keyword-manager/README.md',
            'scripts/etsy-ads-keyword-manager/README.en.md',
            'scripts/etsy-ads-keyword-manager/CHANGELOG.md',
            'scripts/etsy-message-assistant/README.md',
            'scripts/etsy-message-assistant/README.en.md',
            'scripts/etsy-message-assistant/CHANGELOG.md'
          )
          foreach ($path in $paths) {
            $text = Get-Content -Raw -LiteralPath $path
            if ($text -match '[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]') {
              throw "Unexpected control character in $path"
            }
          }

      - name: Check Message Assistant JavaScript syntax
        run: node --check scripts/etsy-message-assistant/Makaytron-Etsy-Message-Assistant.user.js

      - name: Run Message Assistant behavior tests
        run: node --test tools/Test-Message-Assistant.mjs

      - name: Smoke-test browser fixture
        run: node --test tools/Test-Message-Assistant-Browser-Fixture.mjs

      - name: Enforce public fixture privacy
        shell: pwsh
        run: ./tools/Sanitize-Public-Fixtures.ps1

      - name: Run complete distribution gate
        shell: pwsh
        run: ./tools/Test-Distribution.ps1

      - name: Patch hygiene
        run: git diff --check

      - name: Confirm final normalization scope
        shell: pwsh
        run: |
          $changed = @(git diff --name-only)
          if (($changed -join "`n") -ne 'scripts/etsy-message-assistant/CHANGELOG.md') {
            throw "Unexpected final normalization scope: $($changed -join ', ')"
          }

      - name: Commit verified changelog normalization
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/etsy-message-assistant/CHANGELOG.md
          git commit -m "docs: normalize Message Assistant 1.2.8 changelog"
          git push origin HEAD:fix/privacy-blocked-literal
