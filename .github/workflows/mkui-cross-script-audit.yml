name: Generate MKUI Cross-script Audit

on:
  push:
    branches:
      - automation/mkui-cross-script-qa-v1
    paths:
      - .github/workflows/mkui-cross-script-audit.yml
      - tools/Audit-Mkui-Cross-Script-Coexistence.mjs
      - scripts/**/*.user.js
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mkui-cross-script-audit-v1
  cancel-in-progress: true

jobs:
  audit:
    name: Inventory production coexistence surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out QA branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Validate audit tool
        run: node --check tools/Audit-Mkui-Cross-Script-Coexistence.mjs

      - name: Generate coexistence audit
        run: node tools/Audit-Mkui-Cross-Script-Coexistence.mjs --write

      - name: Commit coexistence audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/design/previews/mkui-cross-script-coexistence-audit.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Cross-script coexistence audit is already current.'
            exit 0
          fi
          git commit -m 'docs: record MKUI cross-script coexistence audit'
          git push origin HEAD:automation/mkui-cross-script-qa-v1
