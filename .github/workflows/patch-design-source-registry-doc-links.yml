name: Patch Design Source Registry Documentation Links

on:
  push:
    branches:
      - docs/design-source-registry-v1
    paths:
      - .github/workflows/patch-design-source-registry-doc-links.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-design-source-registry-doc-links
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out source-registry branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Add registry links to public and contributor documentation
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function insertAfter(path, anchor, addition, marker) {
            let text = fs.readFileSync(path, 'utf8');
            if (text.includes(marker)) return;
            const matches = text.split(anchor).length - 1;
            if (matches !== 1) {
              throw new Error(`${path}: expected one anchor, found ${matches}: ${anchor}`);
            }
            text = text.replace(anchor, `${anchor}\n\n${addition}`);
            fs.writeFileSync(path, text);
          }

          function insertBefore(path, anchor, addition, marker) {
            let text = fs.readFileSync(path, 'utf8');
            if (text.includes(marker)) return;
            const matches = text.split(anchor).length - 1;
            if (matches !== 1) {
              throw new Error(`${path}: expected one anchor, found ${matches}: ${anchor}`);
            }
            text = text.replace(anchor, `${addition}\n\n${anchor}`);
            fs.writeFileSync(path, text);
          }

          insertAfter(
            'README.md',
            'The normative rules are in [Mandatory Design Source Lock](./docs/design/DESIGN-SOURCE-LOCK.md).',
            'Approved source IDs and exact locators are locked in [DESIGN-SOURCE-REGISTRY.json](./docs/design/DESIGN-SOURCE-REGISTRY.json). Every UI pull request must cite those registered IDs; a bare repository name, generic catalog URL, or “inspired by” description is rejected.',
            'Approved source IDs and exact locators are locked in',
          );

          insertAfter(
            'README.tr.md',
            'Kesin kurallar [Zorunlu Tasarım Kaynağı Kilidi](./docs/design/DESIGN-SOURCE-LOCK.md) belgesindedir.',
            'Onaylı kaynak kimlikleri ve kesin konumları [DESIGN-SOURCE-REGISTRY.json](./docs/design/DESIGN-SOURCE-REGISTRY.json) içinde kilitlidir. Her UI pull request bu kayıtlı kimlikleri belirtmelidir; yalnız repo adı, genel katalog URL\'si veya “benzeri” açıklaması kabul edilmez.',
            'Onaylı kaynak kimlikleri ve kesin konumları',
          );

          insertAfter(
            '.github/CONTRIBUTING.md',
            '- Record the exact repository path, page URL, block family and block name/number in the pull request.',
            '- Cite registered source IDs from [DESIGN-SOURCE-REGISTRY.json](../docs/design/DESIGN-SOURCE-REGISTRY.json); bare repository names, generic block-library references and unregistered aliases fail CI.',
            'Cite registered source IDs from [DESIGN-SOURCE-REGISTRY.json]',
          );

          insertAfter(
            '.github/CONTRIBUTING.md',
            '- Kullanılan kesin repo yolu, sayfa URL\'si, blok ailesi ve blok adı/numarası pull requestte yazılmalıdır.',
            '- [DESIGN-SOURCE-REGISTRY.json](../docs/design/DESIGN-SOURCE-REGISTRY.json) içindeki kayıtlı kaynak kimlikleri belirtilmelidir; yalnız repo adı, genel blok kütüphanesi bağlantısı ve kayıt dışı takma adlar CI tarafından reddedilir.',
            'içindeki kayıtlı kaynak kimlikleri belirtilmelidir',
          );

          insertAfter(
            'docs/design/MKUI-DESIGN-CONTRACT-v1.md',
            'The normative no-invention and source-traceability rules are in [`DESIGN-SOURCE-LOCK.md`](./DESIGN-SOURCE-LOCK.md). The detailed block-selection catalog is in [`SHADCNSTORE-REFERENCE-CATALOG.md`](./SHADCNSTORE-REFERENCE-CATALOG.md).',
            'The machine-readable allowlist is [`DESIGN-SOURCE-REGISTRY.json`](./DESIGN-SOURCE-REGISTRY.json). UI work must cite registered `source-id` values and their exact locators; unregistered aliases and generic “inspired by” references are not valid sources.',
            'The machine-readable allowlist is [`DESIGN-SOURCE-REGISTRY.json`]',
          );

          insertBefore(
            'docs/design/SHADCNSTORE-REFERENCE-CATALOG.md',
            '## Source-lock priority',
            '## Registered source IDs\n\nThe normative machine-readable allowlist is [`DESIGN-SOURCE-REGISTRY.json`](./DESIGN-SOURCE-REGISTRY.json). Select a registered `template.*`, `shadcn.dashboard.applied`, and exact `shadcn.blocks.*` source before implementation. Toast changes must also cite the applicable `toast.*` ids and exact Toast-01 paths. A general catalog link alone is not a component source.',
            '## Registered source IDs',
          );
          NODE

      - name: Validate and commit documentation links
        shell: bash
        run: |
          set -euo pipefail
          node --test tools/Test-Design-Source-Registry.mjs
          node --test tools/Test-Design-Source-Lock.mjs
          node --test tools/Test-Design-Source-PR.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md README.tr.md .github/CONTRIBUTING.md docs/design/MKUI-DESIGN-CONTRACT-v1.md docs/design/SHADCNSTORE-REFERENCE-CATALOG.md
          if git diff --cached --quiet; then
            echo 'Registry documentation links are already present.'
            exit 0
          fi
          git commit -m 'docs: link registered design sources across contributor guidance'
          git push origin HEAD:docs/design-source-registry-v1
