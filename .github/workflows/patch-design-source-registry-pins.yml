name: Patch Design Source Registry Pins

on:
  push:
    branches:
      - docs/design-source-registry-v1
    paths:
      - .github/workflows/patch-design-source-registry-pins.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-design-source-registry-pins
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out source-registry branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Correct verified source blob pins
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'docs/design/DESIGN-SOURCE-REGISTRY.json';
          const registry = JSON.parse(fs.readFileSync(path, 'utf8'));
          const pins = new Map([
            ['template.shell.base-layout', '4d42209f3cc720e070528393deb378d807650112'],
            ['template.shell.app-sidebar', 'edd83d66cbc946d6b03aef93a6bb663898175ac5'],
            ['template.shell.site-header', '07788d552c9fe00cedbeed7512a72848e9603b08'],
            ['toast.styles', '62e47cc4de7d33fbc2f70aff1c3f8156135d65c0'],
          ]);
          for (const source of registry.sources) {
            if (pins.has(source.id)) source.verifiedBlobSha = pins.get(source.id);
          }
          fs.writeFileSync(path, `${JSON.stringify(registry, null, 2)}\n`);
          NODE

      - name: Validate and commit corrected registry
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/Design-Source-Registry.mjs
          node --test tools/Test-Design-Source-Registry.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/design/DESIGN-SOURCE-REGISTRY.json
          if git diff --cached --quiet; then
            echo 'Registry pins already match the verified files.'
            exit 0
          fi
          git commit -m 'docs: correct verified design source blob pins'
          git push origin HEAD:docs/design-source-registry-v1
