name: Keyword Market Analyzer CI

on:
  push:
    branches:
      - main
    tags:
      - 'etsy-keyword-market-analyzer-v*'
    paths:
      - 'scripts/etsy-keyword-market-analyzer/**'
      - 'tools/Test-Keyword-Market-Analyzer.mjs'
      - 'tools/Validate-Standalone-Tag.mjs'
      - 'tools/Test-Updaters.mjs'
      - 'tools/Test-Distribution.ps1'
      - 'tools/Sanitize-Public-Fixtures.ps1'
      - 'shared/mkui/**'
      - 'README.md'
      - 'README.tr.md'
      - '.github/workflows/keyword-market-analyzer-ci.yml'
  pull_request:
    paths:
      - 'scripts/etsy-keyword-market-analyzer/**'
      - 'tools/Test-Keyword-Market-Analyzer.mjs'
      - 'tools/Validate-Standalone-Tag.mjs'
      - 'tools/Test-Updaters.mjs'
      - 'tools/Test-Distribution.ps1'
      - 'tools/Sanitize-Public-Fixtures.ps1'
      - 'shared/mkui/**'
      - 'README.md'
      - 'README.tr.md'
      - '.github/workflows/keyword-market-analyzer-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keyword-market-analyzer-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          node --check scripts/etsy-keyword-market-analyzer/Makaytron-Etsy-Keyword-Market-Analyzer.user.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check tools/Test-Keyword-Market-Analyzer.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check tools/Validate-Standalone-Tag.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate standalone package tag contract
        run: node tools/Validate-Standalone-Tag.mjs --package-slug etsy-keyword-market-analyzer

      - name: Run focused Keyword Market Analyzer regression tests
        run: node --test tools/Test-Keyword-Market-Analyzer.mjs

      - name: Run shared updater regression tests
        run: node --test tools/Test-Updaters.mjs

      - name: Enforce public fixture privacy
        shell: pwsh
        run: ./tools/Sanitize-Public-Fixtures.ps1

      - name: Run complete distribution gate
        shell: pwsh
        run: ./tools/Test-Distribution.ps1
