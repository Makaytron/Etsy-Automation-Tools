name: Apply Ads Command Center v1

on:
  push:
    branches:
      - design/ads-keyword-manager-command-center-v1
    paths:
      - .github/workflows/export-ads-design-workspace.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-ads-command-center-v1
  cancel-in-progress: true

jobs:
  apply-and-validate:
    name: Build, render, verify and publish branch evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out design branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Restore the reviewed tool payload
        shell: bash
        run: |
          set -euo pipefail
          payload_dir='.tmp/ads-command-center-v1-payload'
          cat "${payload_dir}"/payload-* | base64 --decode > "${RUNNER_TEMP}/ads-command-center-tools.tar.gz"
          tar -xzf "${RUNNER_TEMP}/ads-command-center-tools.tar.gz" -C .
          rm -rf "${payload_dir}" .tmp/ads-command-center

      - name: Validate migration tools
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            tools/Apply-Ads-Command-Center-v1.mjs \
            tools/Finalize-Ads-Command-Center-v1.mjs \
            tools/Generate-Ads-Command-Center-Preview.mjs \
            tools/Test-Ads-Command-Center-v1.mjs
          do
            node --check "$file"
          done

      - name: Apply the guarded production redesign
        shell: bash
        run: |
          set -euo pipefail
          node tools/Apply-Ads-Command-Center-v1.mjs --write
          node tools/Finalize-Ads-Command-Center-v1.mjs --write
          node tools/Generate-Ads-Command-Center-Preview.mjs
          sed -i 's/[[:blank:]]\+$//' scripts/etsy-ads-keyword-manager/Makaytron-Etsy-Ads-Keyword-Manager.user.js
          node --check scripts/etsy-ads-keyword-manager/Makaytron-Etsy-Ads-Keyword-Manager.user.js

      - name: Install Chromium for deterministic review evidence
        shell: bash
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Render the real production panel and rule editor
        shell: bash
        run: |
          set -euo pipefail
          preview="file://${GITHUB_WORKSPACE}/docs/design/previews/ads-keyword-manager-command-center-v1.html"
          npx --yes playwright@1.55.0 screenshot \
            --browser=chromium \
            --viewport-size="500,820" \
            --wait-for-timeout=3000 \
            "${preview}?view=panel" \
            assets/screenshots/ads-keywords-panel-ready.png
          npx --yes playwright@1.55.0 screenshot \
            --browser=chromium \
            --viewport-size="1180,844" \
            --wait-for-timeout=3000 \
            "${preview}?view=modal" \
            assets/screenshots/ads-keywords-rule-editor.png

      - name: Verify screenshot dimensions and bind them to the audit
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');

          function readPng(path, expectedWidth, expectedHeight) {
            const buffer = fs.readFileSync(path);
            const signature = buffer.subarray(0, 8).toString('hex');
            if (signature !== '89504e470d0a1a0a') throw new Error(`${path}: invalid PNG signature`);
            const width = buffer.readUInt32BE(16);
            const height = buffer.readUInt32BE(20);
            if (width !== expectedWidth || height !== expectedHeight) {
              throw new Error(`${path}: expected ${expectedWidth}x${expectedHeight}, received ${width}x${height}`);
            }
            if (buffer.length < 30000) throw new Error(`${path}: screenshot is unexpectedly small (${buffer.length} bytes)`);
            return {
              path,
              width,
              height,
              bytes: buffer.length,
              sha256: crypto.createHash('sha256').update(buffer).digest('hex'),
            };
          }

          const panel = readPng('assets/screenshots/ads-keywords-panel-ready.png', 500, 820);
          const editor = readPng('assets/screenshots/ads-keywords-rule-editor.png', 1180, 844);
          const auditPath = 'docs/design/previews/ads-keyword-manager-command-center-v1.audit.json';
          const audit = JSON.parse(fs.readFileSync(auditPath, 'utf8'));
          audit.screenshots = { panel, editor };
          fs.writeFileSync(auditPath, `${JSON.stringify(audit, null, 2)}\n`);
          NODE

      - name: Regenerate shared MKUI evidence
        shell: bash
        run: |
          set -euo pipefail
          node tools/Build-Mkui-Bundle-Manifest.mjs --apply --write
          node tools/Audit-Mkui-Cross-Script-Coexistence.mjs --write

      - name: Run focused Ads behavior and presentation tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tools/Test-Ads-Keyword-Manager.mjs
          node tools/Build-Mkui-Bundle-Manifest.mjs --check
          node --test tools/Test-Mkui-Drift.mjs
          node --test tools/Test-Mkui-Cross-Script-Coexistence.mjs

      - name: Enforce design-source, privacy and distribution gates
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tools/Test-Design-Source-Registry.mjs \
            tools/Test-Design-Source-Lock.mjs \
            tools/Test-Design-Source-PR.mjs
          pwsh -NoProfile -ExecutionPolicy Bypass -File tools/Sanitize-Public-Fixtures.ps1
          pwsh -NoProfile -ExecutionPolicy Bypass -File tools/Test-Distribution.ps1
          git diff --check

      - name: Commit the verified production presentation and evidence
        shell: bash
        run: |
          set -euo pipefail
          publish_paths=(
            README.md
            README.tr.md
            scripts/etsy-ads-keyword-manager/Makaytron-Etsy-Ads-Keyword-Manager.user.js
            scripts/etsy-ads-keyword-manager/README.md
            scripts/etsy-ads-keyword-manager/README.en.md
            scripts/etsy-ads-keyword-manager/CHANGELOG.md
            docs/design/MIGRATION-PLAN.md
            docs/design/contracts/ads-keyword-manager.md
            docs/design/previews/ads-keyword-manager-command-center-v1.html
            docs/design/previews/ads-keyword-manager-command-center-v1.audit.json
            docs/design/previews/mkui-cross-script-coexistence-audit.json
            shared/mkui/bundle-manifest.json
            tools/Test-Ads-Keyword-Manager.mjs
            assets/screenshots/ads-keywords-panel-ready.png
            assets/screenshots/ads-keywords-rule-editor.png
          )
          for path in "${publish_paths[@]}"; do
            test -e "$path" || { echo "Missing expected publish path: $path" >&2; exit 1; }
          done

          rm -f \
            docs/design/previews/.ads-command-center-pr-ready \
            docs/design/previews/.ads-command-center-pr-ready-2 \
            docs/design/previews/.do-not-commit \
            tools/Finalize-Ads-Command-Center-v1.mjs
          git rm -f --ignore-unmatch \
            .github/workflows/export-ads-design-workspace.yml \
            .github/workflows/finalize-ads-command-center-v1.yml \
            .github/workflows/verify-ads-command-center-v1.yml \
            .github/workflows/remove-noop-marker.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Ads Command Center v1 is already generated and verified.'
            exit 0
          fi
          git commit -m 'design: rebuild Ads Keyword Manager as a responsive command center'
          git push origin HEAD:design/ads-keyword-manager-command-center-v1

      - name: Upload review evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ads-command-center-v1-review
          if-no-files-found: error
          retention-days: 7
          path: |
            docs/design/previews/ads-keyword-manager-command-center-v1.html
            docs/design/previews/ads-keyword-manager-command-center-v1.audit.json
            assets/screenshots/ads-keywords-panel-ready.png
            assets/screenshots/ads-keywords-rule-editor.png
            scripts/etsy-ads-keyword-manager/Makaytron-Etsy-Ads-Keyword-Manager.user.js
