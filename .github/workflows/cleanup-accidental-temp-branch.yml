name: Cleanup Accidental Temporary Branch

on:
  push:
    branches:
      - automation/listing-analyzer-mkui-v1.2.3
    paths:
      - .github/workflows/cleanup-accidental-temp-branch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete accidental empty temporary branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: gh api --method DELETE "repos/${GH_REPOSITORY}/git/refs/heads/tmp-should-not-create"
