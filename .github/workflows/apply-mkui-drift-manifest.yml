name: Apply MKUI Drift Manifest

on:
  push:
    branches:
      - automation/mkui-cross-script-qa-v1
    paths:
      - .github/workflows/apply-mkui-drift-manifest.yml
      - tools/Build-Mkui-Bundle-Manifest.mjs
      - tools/Test-Mkui-Drift.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-mkui-drift-manifest-v1
  cancel-in-progress: true

jobs:
  apply:
    name: Stamp canonical bundle hash and build manifest
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out QA branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Validate drift tools
        shell: pwsh
        run: |
          node --check tools/Build-Mkui-Bundle-Manifest.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Bundle manifest generator syntax failed.' }
          node --check tools/Test-Mkui-Drift.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Drift test syntax failed.' }

      - name: Stamp production scripts and generate manifest
        run: node tools/Build-Mkui-Bundle-Manifest.mjs --apply --write

      - name: Refresh coexistence audit after marker insertion
        run: node tools/Audit-Mkui-Cross-Script-Coexistence.mjs --write

      - name: Verify production script syntax
        shell: pwsh
        run: |
          $scripts = @(
              'scripts/etsy-ads-keyword-manager/Makaytron-Etsy-Ads-Keyword-Manager.user.js'
              'scripts/etsy-keyword-market-analyzer/Makaytron-Etsy-Keyword-Market-Analyzer.user.js'
              'scripts/etsy-sale-campaign-batch-runner/Etsy-Sale-Campaign-Batch-Runner.user.js'
              'scripts/etsy-message-assistant/Makaytron-Etsy-Message-Assistant.user.js'
              'scripts/etsy-listing-analyzer/Makaytron-Etsy-Listing-Analyzer.user.js'
          )
          foreach ($script in $scripts) {
              node --check $script
              if ($LASTEXITCODE -ne 0) { throw "Userscript syntax failed: $script" }
          }

      - name: Run drift and coexistence suites
        shell: pwsh
        run: |
          node --test tools/Test-Mkui-Drift.mjs
          if ($LASTEXITCODE -ne 0) { throw 'MKUI drift suite failed.' }
          node --test tools/Test-Mkui-Cross-Script-Coexistence.mjs
          if ($LASTEXITCODE -ne 0) { throw 'MKUI coexistence suite failed.' }

      - name: Commit generated markers and manifests
        shell: pwsh
        run: |
          $paths = @(
              'shared/mkui/bundle-manifest.json'
              'docs/design/previews/mkui-cross-script-coexistence-audit.json'
              'scripts/etsy-ads-keyword-manager/Makaytron-Etsy-Ads-Keyword-Manager.user.js'
              'scripts/etsy-keyword-market-analyzer/Makaytron-Etsy-Keyword-Market-Analyzer.user.js'
              'scripts/etsy-sale-campaign-batch-runner/Etsy-Sale-Campaign-Batch-Runner.user.js'
              'scripts/etsy-message-assistant/Makaytron-Etsy-Message-Assistant.user.js'
              'scripts/etsy-listing-analyzer/Makaytron-Etsy-Listing-Analyzer.user.js'
          )
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $paths
          if ($LASTEXITCODE -ne 0) { throw 'Generated files could not be staged.' }
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Generated patch contains whitespace errors.' }
          git diff --cached --quiet
          $diffExit = $LASTEXITCODE
          if ($diffExit -eq 0) {
              Write-Host 'MKUI bundle manifest and production markers are already current.'
              exit 0
          }
          if ($diffExit -ne 1) { throw "Unable to inspect generated patch: exit $diffExit" }
          git commit -m 'build: stamp MKUI bundle hash across production scripts'
          if ($LASTEXITCODE -ne 0) { throw 'Generated MKUI files could not be committed.' }
          git push origin HEAD:automation/mkui-cross-script-qa-v1
          if ($LASTEXITCODE -ne 0) { throw 'Generated MKUI commit could not be pushed.' }
