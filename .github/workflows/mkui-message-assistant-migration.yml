name: Apply Message Assistant MKUI v1

# Historical one-time migration workflow. The MKUI v1 migration is complete.
# Keep this workflow manually dispatchable for audit/reproduction only; normal
# production pushes are validated by message-assistant-ci.yml and MKUI drift CI.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mkui-message-assistant-migration-manual
  cancel-in-progress: true

jobs:
  migrate:
    name: Reproduce historical transform, verify and preview
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Validate migration tools
        shell: pwsh
        run: |
          $files = @(
              'tools/Apply-Mkui-Message-Pilot.mjs'
              'tools/Finalize-Mkui-Message-Migration.mjs'
              'tools/Generate-Mkui-Message-Assistant-Preview.mjs'
              'tools/Test-Mkui-Message-Assistant.mjs'
          )
          foreach ($file in $files) {
              node --check $file
              if ($LASTEXITCODE -ne 0) { throw "Syntax validation failed: $file" }
          }

      - name: Apply guarded Message Assistant MKUI transform
        run: node tools/Apply-Mkui-Message-Pilot.mjs --write

      - name: Finalize historical version and documentation
        run: node tools/Finalize-Mkui-Message-Migration.mjs --write

      - name: Verify transformed source syntax
        run: node --check scripts/etsy-message-assistant/Makaytron-Etsy-Message-Assistant.user.js

      - name: Run MKUI invariant tests
        run: node --test tools/Test-Mkui-Message-Assistant.mjs

      - name: Run Message Assistant behavior tests
        run: node --test tools/Test-Message-Assistant.mjs

      - name: Run isolated Chrome fixture
        run: node --test tools/Test-Message-Assistant-Browser-Fixture.mjs

      - name: Generate preview from production CSS
        shell: pwsh
        run: |
          node tools/Generate-Mkui-Message-Assistant-Preview.mjs --output=docs/design/previews
          if ($LASTEXITCODE -ne 0) { throw 'Preview HTML generation failed.' }

      - name: Capture the historical MKUI preview
        shell: pwsh
        run: |
          $html = Resolve-Path 'docs/design/previews/message-assistant-mkui-preview.html'
          $outputDirectory = Join-Path $PWD 'assets/screenshots'
          New-Item -ItemType Directory -Force -Path $outputDirectory | Out-Null
          $png = Join-Path $outputDirectory 'message-assistant-mkui-workspace-v1.2.9.png'
          $profileDirectory = Join-Path $env:RUNNER_TEMP 'mkui-message-assistant-preview-chrome'
          New-Item -ItemType Directory -Force -Path $profileDirectory | Out-Null
          $chromeCandidates = @(
              (Join-Path $env:ProgramFiles 'Google/Chrome/Application/chrome.exe'),
              $(if (${env:ProgramFiles(x86)}) { Join-Path ${env:ProgramFiles(x86)} 'Google/Chrome/Application/chrome.exe' }),
              $(if ($env:LOCALAPPDATA) { Join-Path $env:LOCALAPPDATA 'Google/Chrome/Application/chrome.exe' })
          ) | Where-Object { $_ -and (Test-Path $_) }
          $chrome = $chromeCandidates | Select-Object -First 1
          if (-not $chrome) { throw 'Google Chrome was not found on the runner.' }
          $uri = ([System.Uri]$html.Path).AbsoluteUri
          $arguments = @(
              '--headless=new',
              '--disable-background-networking',
              '--disable-component-update',
              '--disable-default-apps',
              '--disable-extensions',
              '--disable-gpu',
              '--hide-scrollbars',
              '--no-first-run',
              '--force-device-scale-factor=1',
              '--window-size=1440,900',
              '--virtual-time-budget=1800',
              "--user-data-dir=$profileDirectory",
              "--screenshot=$png",
              $uri
          )
          $process = Start-Process -FilePath $chrome -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Chrome screenshot failed with exit code $($process.ExitCode)." }
          for ($attempt = 0; $attempt -lt 20 -and -not (Test-Path $png); $attempt += 1) {
              Start-Sleep -Milliseconds 250
          }
          if (-not (Test-Path $png)) { throw 'Preview screenshot was not created.' }
          $size = (Get-Item $png).Length
          if ($size -lt 40000) { throw "Preview screenshot is unexpectedly small: $size bytes." }
          Write-Host "Generated $png ($size bytes)."

      - name: Enforce public fixture privacy
        shell: pwsh
        run: ./tools/Sanitize-Public-Fixtures.ps1

      - name: Run complete distribution gate
        shell: pwsh
        run: ./tools/Test-Distribution.ps1

      - name: Check patch hygiene
        run: git diff --check

      - name: Commit verified historical migration to pull-request branch
        id: publish
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publishBranch = 'automation/message-assistant-mkui-v1.2.9'
          $publishPaths = @(
              'scripts/etsy-message-assistant/Makaytron-Etsy-Message-Assistant.user.js'
              'scripts/etsy-message-assistant/README.md'
              'scripts/etsy-message-assistant/README.en.md'
              'scripts/etsy-message-assistant/CHANGELOG.md'
              'README.md'
              'README.tr.md'
              'docs/design/MIGRATION-PLAN.md'
              'docs/design/MKUI-DESIGN-CONTRACT-v1.md'
              'docs/design/contracts/message-assistant.md'
              'docs/design/previews/message-assistant-mkui-preview.html'
              'assets/screenshots/message-assistant-mkui-workspace-v1.2.9.png'
          )

          foreach ($path in $publishPaths) {
              if (-not (Test-Path -LiteralPath $path)) {
                  throw "Expected publish path is missing: $path"
              }
          }

          git config user.name 'github-actions[bot]'
          if ($LASTEXITCODE -ne 0) { throw 'git config user.name failed.' }
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ($LASTEXITCODE -ne 0) { throw 'git config user.email failed.' }

          git add -f -- $publishPaths
          if ($LASTEXITCODE -ne 0) { throw 'git add failed.' }

          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Staged patch hygiene failed.' }

          git diff --cached --quiet
          $diffExit = $LASTEXITCODE
          if ($diffExit -eq 0) {
              $current = (git rev-parse HEAD).Trim()
              if ($LASTEXITCODE -ne 0 -or -not $current) { throw 'Unable to resolve current HEAD.' }
              Write-Host 'Message Assistant MKUI migration was already published.'
              "changed=false" >> $env:GITHUB_OUTPUT
              "commit_sha=$current" >> $env:GITHUB_OUTPUT
              exit 0
          } elseif ($diffExit -ne 1) {
              throw "Unable to inspect staged changes; git diff exited with $diffExit."
          }

          git commit -m 'MKUI v1: reproduce Message Assistant workspace migration'
          if ($LASTEXITCODE -ne 0) { throw 'git commit failed.' }

          $local = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $local) { throw 'Unable to resolve local HEAD.' }

          git push origin "HEAD:refs/heads/$publishBranch"
          if ($LASTEXITCODE -ne 0) { throw "git push to $publishBranch failed." }

          git fetch origin $publishBranch
          if ($LASTEXITCODE -ne 0) { throw 'git fetch after branch push failed.' }
          $remote = (git rev-parse "origin/$publishBranch").Trim()
          if ($LASTEXITCODE -ne 0 -or -not $remote) { throw "Unable to resolve origin/$publishBranch." }
          if ($local -ne $remote) {
              throw "Remote branch verification failed: local=$local remote=$remote"
          }

          Write-Host "Verified $publishBranch at $remote"
          "changed=true" >> $env:GITHUB_OUTPUT
          "commit_sha=$remote" >> $env:GITHUB_OUTPUT
          "publish_branch=$publishBranch" >> $env:GITHUB_OUTPUT

      - name: Upload historical preview artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: message-assistant-mkui-v1.2.9-preview
          path: |
            docs/design/previews/message-assistant-mkui-preview.html
            assets/screenshots/message-assistant-mkui-workspace-v1.2.9.png
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14
