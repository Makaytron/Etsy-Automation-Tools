name: One-time Policy Workflow Consistency v4

on:
  push:
    branches:
      - automation/policy-workflow-consistency-v4
    paths:
      - '.github/workflows/one-time-policy-workflow-consistency-v4.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: automation/policy-workflow-consistency-v4
          fetch-depth: 0

      - name: Apply exact consistency repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count):
              p = Path(path)
              source = p.read_text(encoding='utf-8')
              actual = source.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} exact occurrence(s), found {actual}: {old!r}')
              p.write_text(source.replace(old, new), encoding='utf-8', newline='\n')

          replace_exact('SECURITY.md', 'Listing Analyzer `v1.2.2`', 'Listing Analyzer', 1)
          replace_exact('SECURITY.en.md', 'Listing Analyzer `v1.2.2`', 'Listing Analyzer', 1)
          replace_exact('PRIVACY.md', 'Son güncelleme: 2026-08-27', 'Son güncelleme: 2026-09-04', 1)
          replace_exact('PRIVACY.md', 'Listing Analyzer `v1.2.2`', 'Listing Analyzer', 1)
          replace_exact('PRIVACY.en.md', 'Last updated: 2026-08-27', 'Last updated: 2026-09-04', 1)
          replace_exact('PRIVACY.en.md', 'Listing Analyzer `v1.2.2`', 'Listing Analyzer', 1)

          distribution_anchor = """Write-Host 'PASS community health files=3'\n\n$updaterTestPath = Join-Path $repoRoot 'tools/Test-Updaters.mjs'\n"""
          distribution_replacement = """Write-Host 'PASS community health files=3'\n\n$activePolicyValidatorPath = Join-Path $repoRoot 'tools/Validate-Active-Policy-Docs.mjs'\nAssert-True (Test-Path -LiteralPath $activePolicyValidatorPath -PathType Leaf) 'Active policy validator is missing.'\n& node $activePolicyValidatorPath\nAssert-True ($LASTEXITCODE -eq 0) 'Active policy validation failed.'\n\n$workflowValidatorPath = Join-Path $repoRoot 'tools/Validate-Workflow-ReadOnly.mjs'\nAssert-True (Test-Path -LiteralPath $workflowValidatorPath -PathType Leaf) 'Workflow read-only validator is missing.'\n& node $workflowValidatorPath\nAssert-True ($LASTEXITCODE -eq 0) 'Workflow read-only validation failed.'\n\n$releaseTagContractTestPath = Join-Path $repoRoot 'tools/Test-Release-Tag-Contracts.mjs'\nAssert-True (Test-Path -LiteralPath $releaseTagContractTestPath -PathType Leaf) 'Release tag contract regression test is missing.'\n& node --test $releaseTagContractTestPath\nAssert-True ($LASTEXITCODE -eq 0) 'Release tag contract regression tests failed.'\n\n$updaterTestPath = Join-Path $repoRoot 'tools/Test-Updaters.mjs'\n"""
          replace_exact('tools/Test-Distribution.ps1', distribution_anchor, distribution_replacement, 1)

          agents_anchor = """Adding a new production userscript is a distribution-schema change, not just a new file. Before it can ship, extend the exact-five inventory and all affected registries/gates deliberately: `tools/Test-Distribution.ps1`, hosted-channel mappings, MKUI production registry/drift coverage where applicable, root/package documentation, and a dedicated product CI. The new script must then follow the same update URL, SemVer, documentation, identity, privacy, and release rules from its first reviewed release.\n\n"""
          agents_replacement = agents_anchor + """Active `SECURITY.md`, `SECURITY.en.md`, `PRIVACY.md`, and `PRIVACY.en.md` describe current production behavior and must stay version-agnostic for product behavior claims. Historical version-specific behavior belongs in release/advisory or migration records, not in the active policy prose. The Turkish and English privacy-policy update dates must stay synchronized.\n\nAll committed GitHub Actions workflows are repository-read-only. Keep top-level `contents: read`, pin third-party actions to full immutable commit SHAs, set `persist-credentials: false` on checkout, and never commit, push, create branches/tags/releases, or otherwise mutate repository state from Actions. Runner-workspace generation such as deterministic `--write` preview reproduction is allowed only when no repository mutation follows.\n\n"""
          replace_exact('AGENTS.md', agents_anchor, agents_replacement, 1)
          PY

      - name: Validate repaired policy and release contracts
        run: |
          node tools/Validate-Active-Policy-Docs.mjs
          node --test tools/Test-Release-Tag-Contracts.mjs
          git diff --check

      - name: Commit repairs to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SECURITY.md SECURITY.en.md PRIVACY.md PRIVACY.en.md AGENTS.md tools/Test-Distribution.ps1
          git diff --cached --quiet && { echo 'Expected consistency repairs were not produced.' >&2; exit 1; }
          git commit -m 'ci: close policy and workflow consistency gaps'
          git push origin HEAD:automation/policy-workflow-consistency-v4
