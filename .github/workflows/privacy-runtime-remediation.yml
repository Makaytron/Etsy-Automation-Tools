name: Blank Signature Runtime Remediation

on:
  push:
    branches:
      - privacy/remove-personalized-defaults
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blank-signature-runtime-remediation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remediate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Canonicalize prepared campaign text
        shell: pwsh
        run: |
          $path = 'scripts/etsy-message-assistant/Makaytron-Etsy-Message-Assistant.user.js'
          $text = [System.IO.File]::ReadAllText($path, [System.Text.Encoding]::UTF8)
          $old = "            if (!finalText) finalText = baseText;"
          $new = "            if (!finalText) finalText = baseText;`r`n            finalText = String(finalText || '').trim();"
          if ($text.Contains($new)) {
              Write-Host 'Runtime normalization is already present.'
          } elseif ($text.Contains($old)) {
              $text = $text.Replace($old, $new)
              [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))
          } else {
              throw 'Expected campaign finalText assignment was not found.'
          }

      - name: Validate runtime and privacy invariants
        shell: pwsh
        run: |
          node --check scripts/etsy-message-assistant/Makaytron-Etsy-Message-Assistant.user.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tools/Test-Message-Assistant.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/Sanitize-Public-Fixtures.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit runtime remediation
        shell: pwsh
        run: |
          $changes = git status --porcelain
          if (-not $changes) {
              Write-Host 'No remediation changes required.'
              exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/etsy-message-assistant/Makaytron-Etsy-Message-Assistant.user.js
          git commit -m 'fix: normalize blank-signature campaign drafts'
          git push origin HEAD:privacy/remove-personalized-defaults
