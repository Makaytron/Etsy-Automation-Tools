name: Patch MKUI Cross-script Audit Reporting

on:
  push:
    branches:
      - automation/mkui-cross-script-qa-v1
    paths:
      - .github/workflows/patch-mkui-cross-script-audit-reporting.yml
      - tools/Patch-Mkui-Cross-Script-Audit-Reporting.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out QA branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Patch delayed failure reporting
        run: node tools/Patch-Mkui-Cross-Script-Audit-Reporting.mjs

      - name: Generate report while preserving findings
        shell: bash
        run: |
          set +e
          node tools/Audit-Mkui-Cross-Script-Coexistence.mjs --write
          status=$?
          set -e
          test -f docs/design/previews/mkui-cross-script-coexistence-audit.json
          echo "audit_exit=$status"

      - name: Commit audit tool and report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tools/Audit-Mkui-Cross-Script-Coexistence.mjs docs/design/previews/mkui-cross-script-coexistence-audit.json
          git diff --cached --check
          git commit -m 'test: preserve failing coexistence audit report'
          git push origin HEAD:automation/mkui-cross-script-qa-v1
