name: Suite Release CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'VERSION'
      - 'DISTRIBUTION.md'
      - 'docs/releases/**'
      - 'tools/Validate-Suite-Tag.mjs'
      - 'tools/Test-Distribution.ps1'
      - '.github/workflows/suite-release-ci.yml'
  pull_request:
    paths:
      - 'VERSION'
      - 'DISTRIBUTION.md'
      - 'docs/releases/**'
      - 'tools/Validate-Suite-Tag.mjs'
      - 'tools/Test-Distribution.ps1'
      - '.github/workflows/suite-release-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: suite-release-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate suite release contract
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Check suite tag validator syntax
        run: node --check tools/Validate-Suite-Tag.mjs

      - name: Validate suite release tag contract
        run: node tools/Validate-Suite-Tag.mjs

      - name: Run complete distribution gate
        shell: pwsh
        run: ./tools/Test-Distribution.ps1
