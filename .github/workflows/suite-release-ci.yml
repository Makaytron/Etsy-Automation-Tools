name: Suite Release CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'VERSION'
      - 'DISTRIBUTION.md'
      - 'config/production-packages.json'
      - 'docs/releases/v*.md'
      - 'tools/Release-Tag-Verification.mjs'
      - 'tools/Validate-Standalone-Tag.mjs'
      - 'tools/Validate-Suite-Tag.mjs'
      - 'tools/Test-Release-Tag-Contracts.mjs'
      - 'tools/New-Suite-ReleaseAssets.ps1'
      - 'tools/Test-Suite-Release-Assets.ps1'
      - 'tools/Test-Distribution.ps1'
      - '.github/workflows/suite-release-ci.yml'
  pull_request:
    paths:
      - 'VERSION'
      - 'DISTRIBUTION.md'
      - 'config/production-packages.json'
      - 'docs/releases/v*.md'
      - 'tools/Release-Tag-Verification.mjs'
      - 'tools/Validate-Standalone-Tag.mjs'
      - 'tools/Validate-Suite-Tag.mjs'
      - 'tools/Test-Release-Tag-Contracts.mjs'
      - 'tools/New-Suite-ReleaseAssets.ps1'
      - 'tools/Test-Suite-Release-Assets.ps1'
      - 'tools/Test-Distribution.ps1'
      - '.github/workflows/suite-release-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: suite-release-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate suite release contract
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Check release tag validator syntax
        shell: pwsh
        run: |
          $files = @(
              'tools/Release-Tag-Verification.mjs'
              'tools/Validate-Standalone-Tag.mjs'
              'tools/Validate-Suite-Tag.mjs'
              'tools/Test-Release-Tag-Contracts.mjs'
          )
          foreach ($file in $files) {
              node --check $file
              if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax validation failed: $file" }
          }

      - name: Run release tag contract tests
        run: node --test tools/Test-Release-Tag-Contracts.mjs

      - name: Validate suite release tag contract
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/Validate-Suite-Tag.mjs

      - name: Run suite release asset determinism regression
        shell: pwsh
        run: ./tools/Test-Suite-Release-Assets.ps1

      - name: Run complete distribution gate
        shell: pwsh
        run: ./tools/Test-Distribution.ps1

      - name: Build suite release candidate
        if: github.ref_type == 'tag'
        id: package
        shell: pwsh
        env:
          GH_REF_NAME: ${{ github.ref_name }}
        run: |
          $tagName = $env:GH_REF_NAME
          if (-not $tagName.StartsWith('v', [System.StringComparison]::Ordinal)) {
              throw "Unexpected suite release tag: $tagName"
          }
          $expectedVersion = $tagName.Substring(1)
          $outputDirectory = Join-Path $env:RUNNER_TEMP 'etsy-automation-tools-suite-release'
          ./tools/New-Suite-ReleaseAssets.ps1 `
              -ExpectedVersion $expectedVersion `
              -OutputDirectory $outputDirectory
          "artifact_path=$outputDirectory" >> $env:GITHUB_OUTPUT

      - name: Upload suite release candidate
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: etsy-automation-tools-suite-release-candidate
          path: ${{ steps.package.outputs.artifact_path }}
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14
