name: Public Fixture Privacy Guard

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-fixture-privacy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy:
    name: Validate public fixtures without repository mutation
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce public fixture privacy
        shell: pwsh
        run: ./tools/Sanitize-Public-Fixtures.ps1

      - name: Validate Sale Manager fixture behavior
        shell: pwsh
        run: |
          node --check tools/Test-Sale-Manager.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check tools/Run-Sale-Manager-Tests.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/Run-Sale-Manager-Tests.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
