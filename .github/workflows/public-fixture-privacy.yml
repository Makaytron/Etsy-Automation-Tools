name: Public Fixture Privacy Guard

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: public-fixture-privacy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy:
    name: Sanitize and validate public fixtures
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Sanitize public main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: ./tools/Sanitize-Public-Fixtures.ps1 -Fix

      - name: Validate sanitized Sale Manager fixture
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          node --check tools/Test-Sale-Manager.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check tools/Run-Sale-Manager-Tests.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/Run-Sale-Manager-Tests.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit automatic privacy scrub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $changes = git status --porcelain
          if (-not $changes) {
              Write-Host 'No privacy scrub changes required.'
              exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: scrub public fixture account data'
          git push origin HEAD:main

      - name: Enforce public fixture privacy
        shell: pwsh
        run: ./tools/Sanitize-Public-Fixtures.ps1
