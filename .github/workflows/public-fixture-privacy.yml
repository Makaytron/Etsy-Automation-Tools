name: Public Fixture Privacy Guard

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: public-fixture-privacy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy:
    name: Sanitize and validate public fixtures
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref == 'privacy/remove-personalized-defaults' && github.head_ref || github.ref }}

      - name: Apply blank-signature campaign normalization
        if: github.event_name == 'pull_request' && github.head_ref == 'privacy/remove-personalized-defaults'
        shell: pwsh
        run: |
          $path = 'scripts/etsy-message-assistant/Makaytron-Etsy-Message-Assistant.user.js'
          $text = [System.IO.File]::ReadAllText($path, [System.Text.Encoding]::UTF8)
          $old = "            if (!finalText) finalText = baseText;"
          $new = "            if (!finalText) finalText = baseText;`r`n            finalText = String(finalText || '').trim();"
          if ($text.Contains($new)) {
              Write-Host 'Runtime normalization is already present.'
          } elseif ($text.Contains($old)) {
              $text = $text.Replace($old, $new)
              [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))
          } else {
              throw 'Expected campaign finalText assignment was not found.'
          }
          node --check $path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tools/Test-Message-Assistant.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/Sanitize-Public-Fixtures.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (git status --porcelain -- $path) {
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git add $path
              git commit -m 'fix: normalize blank-signature campaign drafts'
              git push origin HEAD:privacy/remove-personalized-defaults
          }

      - name: Sanitize public main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: ./tools/Sanitize-Public-Fixtures.ps1 -Fix

      - name: Validate sanitized Sale Manager fixture
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          node --check tools/Test-Sale-Manager.mjs
          node --test tools/Test-Sale-Manager.mjs

      - name: Commit automatic privacy scrub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $changes = git status --porcelain
          if (-not $changes) {
              Write-Host 'No privacy scrub changes required.'
              exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: scrub public fixture account data'
          git push origin HEAD:main

      - name: Enforce public fixture privacy
        shell: pwsh
        run: ./tools/Sanitize-Public-Fixtures.ps1
