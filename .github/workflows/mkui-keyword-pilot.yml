name: MKUI Keyword Market Analyzer Pilot

on:
  push:
    branches:
      - mkui-keyword-pilot
    paths:
      - '.github/workflows/mkui-keyword-pilot.yml'
      - 'tools/Apply-Mkui-Keyword-Pilot.mjs'
      - 'tools/Test-Keyword-Market-Analyzer.mjs'
      - 'shared/mkui/**'
      - 'docs/design/**'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out pilot branch
        uses: actions/checkout@v4
        with:
          ref: mkui-keyword-pilot
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply deterministic presentation-only pilot
        run: node tools/Apply-Mkui-Keyword-Pilot.mjs --write

      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          node --check scripts/etsy-keyword-market-analyzer/Makaytron-Etsy-Keyword-Market-Analyzer.user.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check tools/Apply-Mkui-Keyword-Pilot.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check tools/Test-Keyword-Market-Analyzer.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run focused Keyword Market Analyzer regression tests
        run: node --test tools/Test-Keyword-Market-Analyzer.mjs

      - name: Run shared updater regression tests
        run: node --test tools/Test-Updaters.mjs

      - name: Enforce public fixture privacy
        shell: pwsh
        run: ./tools/Sanitize-Public-Fixtures.ps1

      - name: Run complete distribution gate
        shell: pwsh
        run: ./tools/Test-Distribution.ps1

      - name: Patch hygiene
        run: git diff --check

      - name: Confirm generated change scope
        shell: pwsh
        run: |
          $changed = @(git diff --name-only | Sort-Object)
          $expected = @(
            'README.md',
            'README.tr.md',
            'docs/keyword-market-analyzer-dry-run-checklist.en.md',
            'docs/keyword-market-analyzer-dry-run-checklist.md',
            'scripts/etsy-keyword-market-analyzer/CHANGELOG.md',
            'scripts/etsy-keyword-market-analyzer/Makaytron-Etsy-Keyword-Market-Analyzer.user.js',
            'scripts/etsy-keyword-market-analyzer/README.en.md',
            'scripts/etsy-keyword-market-analyzer/README.md'
          ) | Sort-Object
          if (($changed -join "`n") -ne ($expected -join "`n")) {
            throw "Unexpected generated pilot scope: $($changed -join ', ')"
          }

      - name: Commit verified pilot result
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.tr.md docs/keyword-market-analyzer-dry-run-checklist.md docs/keyword-market-analyzer-dry-run-checklist.en.md scripts/etsy-keyword-market-analyzer/CHANGELOG.md scripts/etsy-keyword-market-analyzer/Makaytron-Etsy-Keyword-Market-Analyzer.user.js scripts/etsy-keyword-market-analyzer/README.md scripts/etsy-keyword-market-analyzer/README.en.md
          git commit -m "refactor: apply MKUI v1 Keyword pilot [skip ci]"
          git push origin HEAD:mkui-keyword-pilot
