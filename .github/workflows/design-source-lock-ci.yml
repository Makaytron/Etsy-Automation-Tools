name: Design Source Lock CI

on:
  push:
    branches:
      - main
    paths:
      - .github/CONTRIBUTING.md
      - .github/PULL_REQUEST_TEMPLATE.md
      - .github/workflows/design-source-lock-ci.yml
      - README.md
      - README.tr.md
      - docs/design/**
      - scripts/**/*.user.js
      - shared/mkui/**
      - tools/Apply-Design-Source-Lock.mjs
      - tools/Design-Source-Registry.mjs
      - tools/Test-Design-Source-Registry.mjs
      - tools/Test-Design-Source-Lock.mjs
      - tools/Validate-Design-Source-PR.mjs
      - tools/Test-Design-Source-PR.mjs
      - tools/Apply-Mkui-*.mjs
      - tools/Finalize-Mkui-*.mjs
      - tools/Generate-Mkui-*-Preview.mjs
  pull_request:
    paths:
      - .github/CONTRIBUTING.md
      - .github/PULL_REQUEST_TEMPLATE.md
      - .github/workflows/design-source-lock-ci.yml
      - README.md
      - README.tr.md
      - docs/design/**
      - scripts/**/*.user.js
      - shared/mkui/**
      - tools/Apply-Design-Source-Lock.mjs
      - tools/Design-Source-Registry.mjs
      - tools/Test-Design-Source-Registry.mjs
      - tools/Test-Design-Source-Lock.mjs
      - tools/Validate-Design-Source-PR.mjs
      - tools/Test-Design-Source-PR.mjs
      - tools/Apply-Mkui-*.mjs
      - tools/Finalize-Mkui-*.mjs
      - tools/Generate-Mkui-*-Preview.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-source-lock-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate mandatory registered design-source policy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Validate policy tools
        run: |
          node --check tools/Apply-Design-Source-Lock.mjs
          node --check tools/Design-Source-Registry.mjs
          node --check tools/Test-Design-Source-Registry.mjs
          node --check tools/Test-Design-Source-Lock.mjs
          node --check tools/Validate-Design-Source-PR.mjs
          node --check tools/Test-Design-Source-PR.mjs

      - name: Verify policy is fully applied and idempotent
        run: |
          output="$(node tools/Apply-Design-Source-Lock.mjs)"
          printf '%s\n' "$output"
          printf '%s' "$output" | grep -F 'Design source lock is already applied.'

      - name: Validate the machine-readable source registry
        run: node --test tools/Test-Design-Source-Registry.mjs

      - name: Run mandatory policy and PR-gate tests
        run: |
          node --test tools/Test-Design-Source-Lock.mjs
          node --test tools/Test-Design-Source-PR.mjs

      - name: Require completed registered source mapping for UI pull requests
        run: node tools/Validate-Design-Source-PR.mjs

      - name: Check patch hygiene
        run: git diff --check
