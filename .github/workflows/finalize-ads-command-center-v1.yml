name: Finalize Ads Command Center v1

on:
  push:
    branches:
      - design/ads-keyword-manager-command-center-v1
    paths:
      - scripts/etsy-ads-keyword-manager/Makaytron-Etsy-Ads-Keyword-Manager.user.js
      - docs/design/previews/ads-keyword-manager-command-center-v1.html

permissions:
  contents: write

concurrency:
  group: finalize-ads-command-center-v1
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out validated design branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Verify committed design and evidence
        shell: bash
        run: |
          grep -F 'MKUI Ads Command Center v1' scripts/etsy-ads-keyword-manager/Makaytron-Etsy-Ads-Keyword-Manager.user.js
          test -s docs/design/previews/ads-keyword-manager-command-center-v1.html
          test -s docs/design/previews/ads-keyword-manager-command-center-v1.audit.json
          test -s assets/screenshots/ads-keywords-panel-ready.png
          node --test tools/Test-Ads-Keyword-Manager.mjs
          node tools/Build-Mkui-Bundle-Manifest.mjs --check
          node --test tools/Test-Mkui-Drift.mjs
          node --test tools/Test-Mkui-Cross-Script-Coexistence.mjs
          git diff --check

      - name: Remove one-time branch workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm -- \
            .github/workflows/export-ads-design-workspace.yml \
            .github/workflows/finalize-ads-command-center-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove one-time Ads command center workflows'
          git push origin HEAD:design/ads-keyword-manager-command-center-v1
