name: One-time Production Registry v6

# Temporary branch-only migration. Remove before opening the pull request.
on:
  push:
    branches:
      - automation/production-registry-consistency-v6
    paths:
      - '.github/workflows/one-time-production-registry-v6.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: automation/production-registry-consistency-v6
          fetch-depth: 0

      - name: Replace duplicate distribution inventories
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/Test-Distribution.ps1')
          source = path.read_text(encoding='utf-8').replace('\r\n', '\n').replace('\r', '\n')

          old_scripts = """$scripts = @(Get-ChildItem -LiteralPath (Join-Path $repoRoot 'scripts') -Filter '*.user.js' -File -Recurse | Sort-Object FullName)\nAssert-True ($scripts.Count -eq 5) \"Expected exactly five standalone userscripts; found $($scripts.Count).\"\n"""
          new_scripts = """$productionRegistryPath = Join-Path $repoRoot 'config/production-packages.json'\nAssert-True (Test-Path -LiteralPath $productionRegistryPath -PathType Leaf) 'Production package registry is missing.'\n$productionPackages = @(ConvertFrom-Json -InputObject ([System.IO.File]::ReadAllText($productionRegistryPath, [System.Text.Encoding]::UTF8)))\nAssert-True ($productionPackages.Count -eq 5) \"Expected exactly five registered production packages; found $($productionPackages.Count).\"\n$productionPackagesBySlug = @{}\n$scripts = @(\n    foreach ($package in $productionPackages) {\n        $slug = [string]$package.packageSlug\n        Assert-True (-not [string]::IsNullOrWhiteSpace($slug)) 'Production registry contains an empty packageSlug.'\n        Assert-True (-not $productionPackagesBySlug.ContainsKey($slug)) \"Duplicate packageSlug in production registry: $slug\"\n        $productionPackagesBySlug[$slug] = $package\n        $registeredPath = Join-Path $repoRoot ([string]$package.scriptPath).Replace('/', [System.IO.Path]::DirectorySeparatorChar)\n        Assert-True (Test-Path -LiteralPath $registeredPath -PathType Leaf) \"Registered userscript is missing: $($package.scriptPath)\"\n        Get-Item -LiteralPath $registeredPath\n    }\n)\n$scripts = @($scripts | Sort-Object FullName)\n"""

          old_greasy = """        $greasyForkListings = @(\n            [pscustomobject]@{ Id = 589843; Slug = 'etsy-sale-campaign-batch-runner' },\n            [pscustomobject]@{ Id = 589844; Slug = 'etsy-message-assistant' },\n            [pscustomobject]@{ Id = 589845; Slug = 'etsy-ads-keyword-manager' },\n            [pscustomobject]@{ Id = 589846; Slug = 'etsy-listing-analyzer' },\n            [pscustomobject]@{ Id = 589847; Slug = 'etsy-keyword-market-analyzer' }\n        )\n"""
          new_greasy = """        $greasyForkListings = @(\n            foreach ($package in $productionPackages) {\n                [pscustomobject]@{\n                    Id = [int]$package.greasyForkId\n                    Slug = [string]$package.packageSlug\n                }\n            }\n        )\n"""

          old_validator = """$activePolicyValidatorPath = Join-Path $repoRoot 'tools/Validate-Active-Policy-Docs.mjs'\n"""
          new_validator = """$productionRegistryValidatorPath = Join-Path $repoRoot 'tools/Validate-Production-Package-Registry.mjs'\nAssert-True (Test-Path -LiteralPath $productionRegistryValidatorPath -PathType Leaf) 'Production package registry validator is missing.'\n& node $productionRegistryValidatorPath\nAssert-True ($LASTEXITCODE -eq 0) 'Production package registry validation failed.'\n\n$activePolicyValidatorPath = Join-Path $repoRoot 'tools/Validate-Active-Policy-Docs.mjs'\n"""

          for label, old, new in [
              ('production script inventory', old_scripts, new_scripts),
              ('Greasy Fork mapping', old_greasy, new_greasy),
              ('production registry validator hook', old_validator, new_validator),
          ]:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {count}')
              source = source.replace(old, new)

          path.write_text(source, encoding='utf-8', newline='\n')
          PY

          git diff --check

      - name: Validate migrated distribution registry
        run: |
          node tools/Validate-Production-Package-Registry.mjs
          node tools/Validate-Workflow-ReadOnly.mjs || true

      - name: Commit migration to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/Test-Distribution.ps1
          git diff --cached --quiet && { echo 'Expected Test-Distribution.ps1 migration was not produced.' >&2; exit 1; }
          git commit -m 'ci: source production mappings from canonical registry'
          git push origin HEAD:automation/production-registry-consistency-v6
