name: Sale Manager CI

on:
  push:
    branches:
      - main
    tags:
      - 'etsy-sale-campaign-batch-runner-v*'
    paths:
      - 'scripts/etsy-sale-campaign-batch-runner/**'
      - 'tools/Test-Sale-Manager.mjs'
      - 'tools/Run-Sale-Manager-Tests.mjs'
      - 'tools/Validate-Standalone-Tag.mjs'
      - 'tools/Test-Updaters.mjs'
      - 'tools/Test-Distribution.ps1'
      - 'tools/Sanitize-Public-Fixtures.ps1'
      - 'shared/mkui/**'
      - 'README.md'
      - 'README.tr.md'
      - '.github/workflows/sale-manager-ci.yml'
  pull_request:
    paths:
      - 'scripts/etsy-sale-campaign-batch-runner/**'
      - 'tools/Test-Sale-Manager.mjs'
      - 'tools/Run-Sale-Manager-Tests.mjs'
      - 'tools/Validate-Standalone-Tag.mjs'
      - 'tools/Test-Updaters.mjs'
      - 'tools/Test-Distribution.ps1'
      - 'tools/Sanitize-Public-Fixtures.ps1'
      - 'shared/mkui/**'
      - 'README.md'
      - 'README.tr.md'
      - '.github/workflows/sale-manager-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sale-manager-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          node --check scripts/etsy-sale-campaign-batch-runner/Etsy-Sale-Campaign-Batch-Runner.user.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check tools/Test-Sale-Manager.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check tools/Run-Sale-Manager-Tests.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check tools/Validate-Standalone-Tag.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate standalone package tag contract
        run: node tools/Validate-Standalone-Tag.mjs --package-slug etsy-sale-campaign-batch-runner

      - name: Run Sale Manager behavior and safety regression tests
        run: node tools/Run-Sale-Manager-Tests.mjs

      - name: Run shared updater regression tests
        run: node --test tools/Test-Updaters.mjs

      - name: Enforce public fixture privacy
        shell: pwsh
        run: ./tools/Sanitize-Public-Fixtures.ps1

      - name: Run complete distribution gate
        shell: pwsh
        run: ./tools/Test-Distribution.ps1
