name: Verify Ads Command Center v1

on:
  push:
    branches:
      - design/ads-keyword-manager-command-center-v1
    paths:
      - .github/workflows/verify-ads-command-center-v1.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-ads-command-center-v1-final
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Verify production design and permanent gates
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'MKUI Ads Command Center v1' scripts/etsy-ads-keyword-manager/Makaytron-Etsy-Ads-Keyword-Manager.user.js
          test -s docs/design/previews/ads-keyword-manager-command-center-v1.html
          test -s docs/design/previews/ads-keyword-manager-command-center-v1.audit.json
          test -s assets/screenshots/ads-keywords-panel-ready.png
          node --check tools/Apply-Ads-Command-Center-v1.mjs
          node --check tools/Test-Ads-Command-Center-v1.mjs
          node --check tools/Generate-Ads-Command-Center-Preview.mjs
          node --test tools/Test-Ads-Keyword-Manager.mjs
          node tools/Build-Mkui-Bundle-Manifest.mjs --check
          node --test tools/Test-Mkui-Drift.mjs
          node --test tools/Test-Mkui-Cross-Script-Coexistence.mjs
          node --test tools/Test-Design-Source-Registry.mjs tools/Test-Design-Source-Lock.mjs tools/Test-Design-Source-PR.mjs
          pwsh -NoProfile -ExecutionPolicy Bypass -File tools/Test-Distribution.ps1
          git diff --check

      - name: Remove temporary markers and workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            docs/design/previews/.ads-command-center-pr-ready \
            docs/design/previews/.ads-command-center-pr-ready-2
          git rm -f --ignore-unmatch \
            .github/workflows/export-ads-design-workspace.yml \
            .github/workflows/finalize-ads-command-center-v1.yml \
            .github/workflows/verify-ads-command-center-v1.yml
          git add -u -- docs/design/previews
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'No temporary files remain.'
            exit 0
          fi
          git commit -m 'chore: remove Ads command center temporary files'
          git push origin HEAD:design/ads-keyword-manager-command-center-v1
