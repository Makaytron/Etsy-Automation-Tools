name: Ads Keyword Manager CI

on:
  push:
    branches:
      - main
    tags:
      - 'etsy-ads-keyword-manager-v*'
    paths:
      - 'scripts/etsy-ads-keyword-manager/**'
      - 'tools/Test-Ads-Keyword-Manager.mjs'
      - 'tools/Release-Tag-Verification.mjs'
      - 'tools/Validate-Standalone-Tag.mjs'
      - 'tools/Test-Release-Tag-Contracts.mjs'
      - 'tools/New-Standalone-ReleaseAssets.ps1'
      - 'tools/Test-Updaters.mjs'
      - 'tools/Test-Distribution.ps1'
      - 'tools/Sanitize-Public-Fixtures.ps1'
      - 'shared/mkui/**'
      - 'README.md'
      - 'README.tr.md'
      - '.github/workflows/ads-keyword-manager-ci.yml'
  pull_request:
    paths:
      - 'scripts/etsy-ads-keyword-manager/**'
      - 'tools/Test-Ads-Keyword-Manager.mjs'
      - 'tools/Release-Tag-Verification.mjs'
      - 'tools/Validate-Standalone-Tag.mjs'
      - 'tools/Test-Release-Tag-Contracts.mjs'
      - 'tools/New-Standalone-ReleaseAssets.ps1'
      - 'tools/Test-Updaters.mjs'
      - 'tools/Test-Distribution.ps1'
      - 'tools/Sanitize-Public-Fixtures.ps1'
      - 'shared/mkui/**'
      - 'README.md'
      - 'README.tr.md'
      - '.github/workflows/ads-keyword-manager-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ads-keyword-manager-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate Ads Keyword Manager
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          node --check scripts/etsy-ads-keyword-manager/Makaytron-Etsy-Ads-Keyword-Manager.user.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check tools/Test-Ads-Keyword-Manager.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check tools/Release-Tag-Verification.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check tools/Validate-Standalone-Tag.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate standalone package tag contract
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/Validate-Standalone-Tag.mjs --package-slug etsy-ads-keyword-manager

      - name: Run release tag contract tests
        run: node --test tools/Test-Release-Tag-Contracts.mjs

      - name: Run Ads Keyword Manager behavior regression tests
        run: node --test tools/Test-Ads-Keyword-Manager.mjs

      - name: Run shared updater regression tests
        run: node --test tools/Test-Updaters.mjs

      - name: Enforce public fixture privacy
        shell: pwsh
        run: ./tools/Sanitize-Public-Fixtures.ps1

      - name: Run complete distribution gate
        shell: pwsh
        run: ./tools/Test-Distribution.ps1

      - name: Build standalone release assets
        id: package
        shell: pwsh
        run: |
          $outputDirectory = Join-Path $env:RUNNER_TEMP 'etsy-ads-keyword-manager-release'
          ./tools/New-Standalone-ReleaseAssets.ps1 `
              -PackageSlug 'etsy-ads-keyword-manager' `
              -OutputDirectory $outputDirectory
          "artifact_path=$outputDirectory" >> $env:GITHUB_OUTPUT

      - name: Upload the manually publishable release candidate
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: etsy-ads-keyword-manager-release-candidate
          path: ${{ steps.package.outputs.artifact_path }}
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14
