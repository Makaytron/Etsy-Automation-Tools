name: Etsy SPA lifecycle CI

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'shared/lifecycle/**'
      - 'tools/Test-SPA-Lifecycle.mjs'
      - 'tools/Sync-SPA-Lifecycle.mjs'
      - 'config/production-packages.json'
      - '.github/workflows/spa-lifecycle-ci.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Check shared lifecycle source
        run: node tools/Sync-SPA-Lifecycle.mjs --check
      - name: Verify all five applications across same-document navigation
        run: node --test tools/Test-SPA-Lifecycle.mjs
