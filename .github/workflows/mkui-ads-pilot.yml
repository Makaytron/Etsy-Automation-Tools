name: MKUI Ads Pilot

on:
  push:
    branches:
      - mkui-ads-pilot
    paths:
      - '.github/workflows/mkui-ads-pilot.yml'
      - 'tools/Apply-Mkui-Ads-Pilot.mjs'
      - 'shared/mkui/**'
      - 'docs/design/**'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pilot branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: mkui-ads-pilot
          fetch-depth: 0

      - name: Apply or verify deterministic presentation-only pilot
        run: node tools/Apply-Mkui-Ads-Pilot.mjs --write

      - name: Ads Keyword Manager behavior tests
        run: node --test tools/Test-Ads-Keyword-Manager.mjs

      - name: JavaScript syntax check
        run: node --check scripts/etsy-ads-keyword-manager/Makaytron-Etsy-Ads-Keyword-Manager.user.js

      - name: Patch hygiene
        run: git diff --check

      - name: Limit generated changes to the intended production script
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          if [ -n "$changed" ]; then
            test "$changed" = "scripts/etsy-ads-keyword-manager/Makaytron-Etsy-Ads-Keyword-Manager.user.js"
          fi

      - name: Commit generated pilot result when needed
        shell: bash
        run: |
          if git diff --quiet -- scripts/etsy-ads-keyword-manager/Makaytron-Etsy-Ads-Keyword-Manager.user.js; then
            echo "Pilot source is already generated and verified."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/etsy-ads-keyword-manager/Makaytron-Etsy-Ads-Keyword-Manager.user.js
          git commit -m "refactor: apply MKUI v1 Ads pilot [skip ci]"
          git push origin HEAD:mkui-ads-pilot
