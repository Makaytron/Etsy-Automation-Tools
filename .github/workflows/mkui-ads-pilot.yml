name: MKUI Ads Pilot Historical Audit

# The Ads MKUI pilot is fully merged into main. In steady state this workflow
# is manual-only; a pull request that changes this workflow also runs the audit
# once so the historical reproduction path is tested before merge.
on:
  pull_request:
    paths:
      - '.github/workflows/mkui-ads-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Reproduce and verify historical Ads pilot
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out immutable historical pilot snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 1297615c52e2c5e5c211021b795e70df2dfa832b
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Verify historical snapshot identity and ancestry
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "1297615c52e2c5e5c211021b795e70df2dfa832b"
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Reproduce deterministic presentation-only pilot
        run: node tools/Apply-Mkui-Ads-Pilot.mjs --write

      - name: Ads Keyword Manager behavior tests
        run: node --test tools/Test-Ads-Keyword-Manager.mjs

      - name: JavaScript syntax check
        run: node --check scripts/etsy-ads-keyword-manager/Makaytron-Etsy-Ads-Keyword-Manager.user.js

      - name: Patch hygiene
        run: git diff --check

      - name: Limit reproduced changes to the intended production script
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          if [ -n "$changed" ]; then
            test "$changed" = "scripts/etsy-ads-keyword-manager/Makaytron-Etsy-Ads-Keyword-Manager.user.js"
          fi
